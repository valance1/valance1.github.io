<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="CSS/site.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.28/dist/lenis.min.js" defer></script>
  <script src="JS/common.js" defer></script>
  <script src="JS/motion.js" defer></script>
  <script src="JS/project.js" defer></script>
  <link rel="icon" href="Resources/favicon/pilfav.png" type="image/png" />

<body>
  <div class="wipe" aria-hidden="true"><span class="wipe-label">&gt;gabriel_pinotti_</span></div>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" data-label="gabriel_pinotti">gabriel_pinotti<span>_</span></a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html" aria-current="page">Work</a>
        <a href="about.html">About</a>
      </nav>
      <div class="socials" data-socials></div>
    </div>
  </header>

  <main id="project">
    <div class="player-band" id="player-band" hidden>
      <div class="player" id="player"></div>
    </div>
    <div class="tape tape--thin" aria-hidden="true"></div>

    <div class="wrap">
      <div class="project-head">
        <div>
          <h1 class="project-title" id="title"></h1>
          <div class="project-desc" id="desc"></div>
          <div class="chips" id="tags" aria-label="Software used"></div>
        </div>
        <dl class="credits" id="credits"></dl>
      </div>

    </div>

    <section class="gallery-section" id="gallery-section" hidden>
      <div class="tape"><h2 class="tape-label"><span class="p">&gt;</span><span class="w">GALLERY</span><span class="p">&lt;</span></h2></div>
      <div class="hgallery-pin">
        <div class="hgallery" id="gallery"><div class="hgallery-track" id="gallery-track"></div></div>
        <div class="wrap hgallery-meta">
          <span class="hgallery-count" id="gallery-count"></span>
          <span class="hgallery-bar" aria-hidden="true"><i id="gallery-bar"></i></span>
        </div>
      </div>
    </section>

    <div class="tape tape--thin" aria-hidden="true"></div>
    <nav class="wrap pager" id="pager" aria-label="Other projects"></nav>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a class="brand" href="index.html" data-label="gabriel_pinotti">gabriel_pinotti<span>_</span></a>
      <div class="socials" data-socials></div>
      <span>&copy; <span data-year></span> <span data-name>Gabriel Pinotti</span></span>
    </div>
  </footer>
